<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Tailor’s Digital Desk</title>
<meta name="theme-color" content="#2b1a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Tailor’s Desk">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧵%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#f7efe4;--card:#fbf4ea;--champ:#efe3d0;--brown:#2b1a12;--soft:#7d6a5a;--gold:#a97b3c;--line:#e6d6bd;--shadow:0 8px 22px rgba(60,35,15,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark) and (min-width:99999px){:root:not([data-theme="light"]){--bg:#1e1814;--card:#2a221c;--champ:#3a2f26;--brown:#f1e6d3;--soft:#bfa98d;--gold:#d4ad66;--line:#4a3d31;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark-disabled"]{--bg:#1e1814;--card:#2a221c;--champ:#3a2f26;--brown:#f1e6d3;--soft:#bfa98d;--gold:#d4ad66;--line:#4a3d31;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--brown);font:16px/1.55 Jost,"Avenir Next",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0;font-weight:600}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{border:1px solid var(--line);background:var(--card);color:var(--brown);border-radius:14px;padding:10px 14px;font-size:15px;cursor:pointer}
.hero{background:var(--champ);border-radius:24px;padding:32px 24px;margin-bottom:22px}

.hero small{letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;font-size:11px}
.hero h1{font-size:clamp(30px,6vw,44px);line-height:1.1;margin:6px 0}
.hero p{margin:0;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px;text-align:left;cursor:pointer;box-shadow:var(--shadow);color:var(--brown);font:inherit;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ic{width:44px;height:44px;border-radius:14px;background:var(--champ);display:grid;place-items:center;font-size:22px;margin-bottom:10px}
.tile b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:20px}
.tile span{font-size:13px;color:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.search{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--brown);font:inherit;margin-bottom:14px}
.letter{font-family:"Cormorant Garamond",Georgia,serif;color:var(--gold);font-size:22px;margin:16px 4px 6px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;cursor:pointer}
.av{width:46px;height:46px;border-radius:50%;background:var(--champ);border:1px solid var(--gold);display:grid;place-items:center;font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;font-weight:700;flex:none}
.row small,.muted{color:var(--soft)}
.btn{background:var(--brown);color:var(--bg);border:0;border-radius:14px;padding:13px 20px;font:500 15px Jost,system-ui,sans-serif;cursor:pointer}
.btn.gold{background:var(--gold);color:#fff}
.btn.ghost{background:transparent;color:var(--brown);border:1px solid var(--line)}
.btn.del{background:transparent;color:#b3473d;border:1px solid #b3473d}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--soft);margin:14px 0 5px}
input,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--brown);font:inherit}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.chip{display:inline-block;background:var(--champ);border-radius:999px;padding:4px 12px;font-size:13px;margin:3px 4px 3px 0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--gold);color:#fff;border:0;font-size:30px;box-shadow:var(--shadow);cursor:pointer}
.empty{text-align:center;padding:40px 10px;color:var(--soft)}
.dt{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px}
.dt dt{color:var(--soft)}.dt dd{margin:0}
.pill{margin-left:auto;background:var(--gold);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;white-space:nowrap}
select{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--brown);font:inherit}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(min-width:700px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.pill.late{background:#b5655a}
.pill.ok{background:#8a9a84}
.tile .ic span,.av{filter:grayscale(1)}
html{background:#f7efe4}
.hero{padding:44px 28px}
.hero h1{font-size:clamp(40px,10vw,64px);font-weight:500;letter-spacing:-.01em;line-height:1.02;margin:0 0 12px}
.hero h1 em{color:var(--gold);font-weight:500}
.hero p{font-weight:300;letter-spacing:.03em}
.tile{box-shadow:none;border-radius:24px;padding:22px 18px;transition:transform .2s,border-color .2s}
.tile:hover{border-color:var(--gold);transform:translateY(-2px)}
.tile b{font-size:23px;font-weight:500;letter-spacing:.01em}
.tile .ic{background:transparent;border:1px solid var(--line);border-radius:50%}
h2{font-weight:500;letter-spacing:.01em;font-size:30px}
.letter{font-style:italic}
.card{box-shadow:none}
.btn{letter-spacing:.04em}
.hdr{margin:-20px -16px 20px;padding:46px 20px 30px;background:radial-gradient(120% 90% at 20% 0%,#5a3a24 0%,#2b1810 45%,#170b06 100%);border-radius:0 0 50% 50%/0 0 34px 34px;border-bottom:2px solid #d8b46f;position:relative;color:#f6e9d4;display:grid;grid-template-columns:auto 1px 1fr;gap:16px;align-items:center}
.hdr .lg{width:78px;height:78px;border-radius:20px;box-shadow:0 0 22px rgba(226,192,122,.45)}
.hdr .sep{width:1px;height:64px;background:#d8b46f;opacity:.7}
.hdr h1{font-size:clamp(34px,9vw,46px);font-weight:500;line-height:1.02;margin:0;color:#f6e9d4}
.hdr h1 em{color:#e2c07a;font-style:italic;font-weight:500}
.hdr p{grid-column:1/-1;margin:6px 0 0;text-align:center;font-weight:300;letter-spacing:.12em;font-size:13px;color:#ead9bd}
.gear{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;border:1px solid #8a6a3c;background:rgba(0,0,0,.25);color:#e2c07a;font-size:18px;cursor:pointer}
.grid{grid-template-columns:1fr 1fr;gap:14px;margin-bottom:90px}
.tile,.card{background:linear-gradient(145deg,#fffaf2,#f3e6d3);box-shadow:var(--shadow),inset 0 1px 0 #fff}
.tile{position:relative;min-height:168px;padding:16px 16px 18px;border-radius:28px;border:1px solid #efe0c8}
.tile .ic{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#4a2f20,#1f110b);border:1px solid #6b4a2c;display:grid;place-items:center;margin-bottom:12px;box-shadow:0 4px 10px rgba(40,20,8,.35)}
.tile .ic svg{width:26px;height:26px}
.tile b{font-size:22px;font-weight:600;line-height:1.1;display:block}
.tile span{display:block;padding-right:38px;margin-top:4px}
.tile .go{position:absolute;right:12px;bottom:12px;width:36px;height:36px;border-radius:50%;background:#fbf1e1;border:1px solid #e3cfae;display:grid;place-items:center;font-style:normal;font-size:22px;line-height:1;color:#2b1a12;box-shadow:0 3px 8px rgba(60,35,15,.15)}
.tile.wide{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:64px 1fr;column-gap:12px;align-items:center;padding:14px 16px}
.tile.wide .ic{grid-row:1/3;margin:0}
.tile.wide .go{bottom:50%;transform:translateY(50%)}
.av{filter:none;background:#2b1a12;color:#e2c07a;border-color:#a97b3c}
.btn.gold,.fab{background:linear-gradient(135deg,#c79a55,#a97b3c)}
.ftr{position:fixed;left:0;right:0;bottom:0;height:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(180deg,#3b2418,#1c0f09);border-radius:50% 50% 0 0/22px 22px 0 0;border-top:2px solid #d8b46f;display:flex;align-items:center;justify-content:center;gap:14px;z-index:5}
.ftr img{width:38px;height:38px;border-radius:11px}
.ftr:before,.ftr:after{content:"";width:28%;height:1px;background:linear-gradient(90deg,transparent,#d8b46f)}
.ftr:after{transform:scaleX(-1)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:var(--champ);cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="pfile" accept="image/*" multiple hidden onchange="addPhotos(this)">
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=null,mem=[],list=[],view='home',cur=null,mid=null,ofl='active',pfl='owing',wpre='',q='';

/* ---------- IndexedDB (falls back to memory if unavailable) ---------- */
function openDb(){return new Promise(res=>{try{const r=indexedDB.open('tailorsDesk',1);
r.onupgradeneeded=()=>{r.result.createObjectStore('customers',{keyPath:'id',autoIncrement:true});r.result.createObjectStore('meta')};
r.onsuccess=()=>{db=r.result;const _t=db.transaction.bind(db);db.transaction=(...a)=>{const t=_t(...a);t.addEventListener('abort',()=>{try{t.oncomplete&&t.oncomplete()}catch(e){}});return t};res()};r.onerror=()=>res();r.onblocked=()=>res()}catch(e){res()}})}
const store=(n,m)=>db.transaction(n,m||'readonly').objectStore(n);
const getAll=()=>db?new Promise(r=>{const x=store('customers').getAll();x.onsuccess=()=>r(x.result);x.onerror=()=>r([])}):Promise.resolve(mem.slice());
const save=c=>db?new Promise(r=>{const t=db.transaction('customers','readwrite');t.objectStore('customers').put(c);t.oncomplete=()=>r();t.onerror=()=>r()}):(mem=mem.filter(x=>x.id!==c.id),c.id=c.id||Date.now()+Math.random(),mem.push(c),Promise.resolve());
const remove=id=>db?new Promise(r=>{const t=db.transaction('customers','readwrite');t.objectStore('customers').delete(id);t.oncomplete=()=>r()}):(mem=mem.filter(x=>x.id!==id),Promise.resolve());
const clearAll=()=>db?new Promise(r=>{const t=db.transaction('customers','readwrite');t.objectStore('customers').clear();t.oncomplete=()=>r()}):(mem=[],Promise.resolve());
const getMeta=k=>db?new Promise(r=>{const x=store('meta').get(k);x.onsuccess=()=>r(x.result);x.onerror=()=>r()}):Promise.resolve(false);
const setMeta=k=>db?new Promise(r=>{const t=db.transaction('meta','readwrite');t.objectStore('meta').put(true,k);t.oncomplete=()=>r()}):Promise.resolve();

const SAMPLE=[
['Adaeze Okonkwo','+234 000 000 0001','adaeze@example.com','12 Palm Avenue, Lekki, Lagos','1990-11-18',['Emerald','Ivory'],['Lace','Silk'],['Corset gowns','Aso-ebi'],'Prefers hidden zips and extra room at the hip.','Bridal client. Loves a fitting with tea.'],
['Bola Adeyemi','+234 000 000 0002','bola@example.com','4 Ring Road, Ibadan','1985-03-02',['Navy','Burgundy'],['Ankara','Linen'],['Tailored suits','Agbada'],'Sleeves a little longer than standard.','Regular. Orders every festive season.'],
['Chiamaka Eze','+234 000 000 0003','chiamaka@example.com','27 Independence Layout, Enugu','1996-12-01',['Gold','Black'],['Satin','Crepe'],['Jumpsuits','Slip dresses'],'Allergic to scratchy linings.','Referred by Adaeze.'],
['Amara Nwosu','+234 000 000 0004','amara@example.com','9 Garki Close, Abuja','1992-07-22',['Terracotta','Cream'],['Cotton','Linen'],['Shirt dresses'],'Needs pockets on everything.','Prefers WhatsApp messages.'],
['Dayo Balogun','+234 000 000 0005','dayo@example.com','31 Bodija Road, Ibadan','1988-11-09',['Charcoal','Sky blue'],['Wool blend'],['Slim-fit trousers','Kaftan'],'','Wedding guest outfits twice a year.'],
['Zainab Lawal','+234 000 000 0006','zainab@example.com','2 Sabon Gari, Kano','1994-01-30',['Plum','Sage'],['Brocade','Chiffon'],['Abaya','Two-piece sets'],'Modest necklines.','Collects orders in person.']
];
async function seed(){if(await getMeta('seeded'))return;if((await getAll()).length)return;
for(const s of SAMPLE)await save({name:s[0],phone:s[1],email:s[2],address:s[3],birthday:s[4],colours:s[5],fabrics:s[6],styles:s[7],instructions:s[8],notes:s[9]});
await setMeta('seeded')}

/* ---------- helpers ---------- */
const initials=n=>n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const chips=a=>(a&&a.length?a.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="muted">—</span>');
const split=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
function daysToBday(b){if(!b)return null;const p=b.split('-').map(Number),n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
let d=new Date(n.getFullYear(),p[1]-1,p[2]);if(d<t)d=new Date(n.getFullYear()+1,p[1]-1,p[2]);return Math.round((d-t)/864e5)}
const fmtB=b=>b?new Date(b+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'long'}):'—';
const sorted=a=>a.slice().sort((x,y)=>x.name.localeCompare(y.name));
const go=(v,c,m)=>{view=v;cur=c||null;mid=m||null;q='';render();window.scrollTo(0,0)};
async function refresh(){list=sorted(await getAll())}

/* ---------- views ---------- */
const topbar=t=>`<div class="top"><button class="back" onclick="go('home')">← Desk</button><h2>${t}</h2></div>`;
const V={
home(){const up=list.filter(c=>daysToBday(c.birthday)!==null&&daysToBday(c.birthday)<=30).length;
const T=[['week','🕐','This Week',weekSummary()],['customers','👥','My Customers',list.length+' profiles'],['measurements','📏','Measurements',list.reduce((n,c)=>n+(c.measures||[]).length,0)+' saved'],['orders','🧵','Orders',list.reduce((n,c)=>n+(c.orders||[]).filter(o=>o.status!='Delivered').length,0)+' active'],['payments','💳','Payments',owedTotal()+' owing'],['report','📊','Money Report',reportSummary()],['prefs','🎨','Customer Preferences','Colours, fabrics, styles'],['birthdays','🎂','Birthdays',up+' in the next 30 days'],['backup','💾','Backup & Restore','Keep your data safe']];
return `<header class="hdr"><button class="gear" aria-label="Settings" onclick="go('settings')">⚙︎</button><img class="lg" src="${LOGO}" alt=""><span class="sep"></span><h1>Tailor’s<br><em>Digital Desk</em></h1><p>Your clients’ details, beautifully kept — works offline.</p></header>${installCard()}
<div class="grid">${T.map(t=>`<button class="tile${t[0]=='backup'||t[0]=='week'||t[0]=='report'?' wide':''}" onclick="go('${t[0].split(':')[0]}'${t[0].includes(':')?`,'${t[0].split(':')[1]}'`:''})"><div class="ic">${IC[t[1]]}</div><b>${t[2]}</b><span>${t[3]}</span><i class="go">›</i></button>`).join('')}</div><div class="ftr"><img src="${LOGO}" alt=""></div>`},
customers(){const k=q.trim().toLowerCase(),d=k.replace(/\D/g,'');
const f=list.filter(c=>!k||c.name.toLowerCase().includes(k)||(d&&(c.phone||'').replace(/\D/g,'').includes(d)));
let h=topbar('My Customers')+`<input class="search" id="s" placeholder="Search by name or phone number" value="${esc(q)}" oninput="q=this.value;keep()">`;
if(!f.length)h+=`<div class="empty">No customers found.<br>Tap + to add one.</div>`;
let L='';for(const c of f){const l=c.name[0].toUpperCase();if(l!==L){L=l;h+=`<div class="letter">${l}</div>`}
h+=`<div class="card row" onclick="go('detail',${c.id})"><div class="av">${esc(initials(c.name))}</div><div><b>${esc(c.name)}</b><br><small>${esc(c.phone||'No phone')}</small></div></div>`}
return h+`<button class="fab" aria-label="Add customer" onclick="go('form',0)">+</button>`},
detail(){const c=list.find(x=>x.id==cur);if(!c)return V.customers();
return `<div class="top"><button class="back" onclick="go('customers')">← Customers</button></div>
<div class="card" style="text-align:center"><div class="av" style="margin:0 auto 10px;width:72px;height:72px;font-size:30px">${esc(initials(c.name))}</div><h1>${esc(c.name)}</h1><div class="muted">Birthday · ${fmtB(c.birthday)}</div><div class="muted" style="margin-top:4px">${histLine(c)}</div></div>
<div class="card"><h3>Contact</h3><dl class="dt"><dt>Phone</dt><dd>${esc(c.phone)||'—'}</dd><dt>Email</dt><dd>${esc(c.email)||'—'}</dd><dt>Address</dt><dd>${esc(c.address)||'—'}</dd></dl></div>
<div class="card"><h3>Preferences</h3><p class="muted" style="margin:8px 0 2px">Favourite colours</p>${chips(c.colours)}<p class="muted" style="margin:8px 0 2px">Preferred fabrics</p>${chips(c.fabrics)}<p class="muted" style="margin:8px 0 2px">Preferred styles</p>${chips(c.styles)}</div>
<div class="card"><h3>Special instructions</h3><p>${esc(c.instructions)||'—'}</p><h3>Notes</h3><p>${esc(c.notes)||'—'}</p></div>
<div class="card"><h3>Photos</h3>${phGrid(c,c.photos||[])}<div class="actions"><button class="btn gold" onclick="pOid=0;$('#pfile').click()">+ Add photo</button></div></div><div class="actions"><button class="btn gold" onclick="go('mlist',${c.id})">📏 Measurements</button><button class="btn gold" onclick="go('oform',${c.id},0)">🧵 New order</button><button class="btn gold" onclick="go('wa',${c.id},0)">💬 Message</button><button class="btn gold" onclick="go('history',${c.id})">📜 History</button><button class="btn" onclick="go('form',${c.id})">Edit</button><button class="btn del" onclick="del(${c.id})">Delete</button></div>`},
form(){const c=list.find(x=>x.id==cur)||{};const v=k=>esc(Array.isArray(c[k])?c[k].join(', '):c[k]);
return `<div class="top"><button class="back" onclick="go(${c.id?`'detail',${c.id}`:`'customers'`})">← Cancel</button><h2>${c.id?'Edit':'New'} customer</h2></div>
<div class="card">${('contacts' in navigator&&window.ContactsManager)?'<button class="btn ghost" style="width:100%;margin-bottom:6px" onclick="pickContact()">📇 Pick from my contacts</button>':''}<label>Full name *</label><input id="f_name" value="${v('name')}" autocomplete="off">
<div class="two"><div><label>Phone number</label><input id="f_phone" type="tel" value="${v('phone')}"></div><div><label>Email</label><input id="f_email" type="email" value="${v('email')}"></div></div>
<label>Address</label><input id="f_address" value="${v('address')}">
<label>Birthday</label><input id="f_birthday" type="date" value="${v('birthday')}">
<label>Favourite colours (separate with commas)</label><input id="f_colours" value="${v('colours')}" placeholder="Emerald, Ivory">
<label>Preferred fabrics</label><input id="f_fabrics" value="${v('fabrics')}" placeholder="Lace, Silk">
<label>Preferred clothing styles</label><input id="f_styles" value="${v('styles')}" placeholder="Corset gowns, Kaftan">
<label>Special instructions</label><textarea id="f_instructions">${v('instructions')}</textarea>
<label>Customer notes</label><textarea id="f_notes">${v('notes')}</textarea>
<div class="actions"><button class="btn gold" onclick="submitForm(${c.id||0})">Save customer</button></div></div>`},
measurements(){const k=q.trim().toLowerCase(),f=list.filter(c=>!k||c.name.toLowerCase().includes(k));
return topbar('Measurements')+`<input class="search" id="s" placeholder="Find a customer" value="${esc(q)}" oninput="q=this.value;keep()">`+(f.map(c=>{const n=(c.measures||[]).length;return `<div class="card row" onclick="go('mlist',${c.id})"><div class="av">${esc(initials(c.name))}</div><div><b>${esc(c.name)}</b><br><small>${n?n+' saved':'No measurements yet'}</small></div></div>`}).join('')||'<div class="empty">No customers found.</div>')},
mlist(){const c=list.find(x=>x.id==cur);if(!c)return V.measurements();const m=(c.measures||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));

mform(){const c=list.find(x=>x.id==cur);if(!c)return V.measurements();const r=(c.measures||[]).find(x=>x.id==mid)||{vals:{}};const u=r.unit||'in';
return `<div class="top"><button class="back" onclick="go('mlist',${c.id})">← Cancel</button><h2>${r.id?'Edit':'New'} measurements</h2></div><div class="card"><b>${esc(c.name)}</b><label>What is this for?</label><input id="m_label" value="${esc(r.label)}" placeholder="e.g. Wedding gown"><div class="two"><div><label>Date</label><input id="m_date" type="date" value="${esc(r.date||new Date().toISOString().slice(0,10))}"></div><div><label>Unit</label><select id="m_unit"><option value="in"${u=='in'?' selected':''}>Inches</option><option value="cm"${u=='cm'?' selected':''}>Centimetres</option></select></div></div></div>`+groups().map((g,gi)=>`<div class="card"><h3>${g[0]}</h3><div class="mgrid">${g[1].map((n,i)=>`<div><label>${n}${gi>=MF.length?`<button class="back" style="padding:0 8px;margin-left:6px;font-size:12px" aria-label="Remove ${esc(n)}" onclick="rmCF(${i})">✕</button>`:''}</label><input id="m_${gi}_${i}" type="number" step="0.1" min="0" inputmode="decimal" value="${esc(r.vals[n])}"></div>`).join('')}</div></div>`).join('')+`<div class="card"><h3>Add your own measurement</h3><p class="muted" style="margin:4px 0 8px">For example: Half hip, Nape to waist, Calf. It will appear for every customer.</p><div style="display:flex;gap:10px"><input id="m_newf" placeholder="Name of measurement"><button class="btn gold" onclick="addCF()">Add</button></div></div><div class="card"><label>Fitting notes</label><textarea id="m_note">${esc(r.note)}</textarea><div class="actions"><button class="btn gold" onclick="submitM(${c.id},${r.id||0})">Save measurements</button></div></div>`},
orders(){const all=[];list.forEach(c=>(c.orders||[]).forEach(o=>all.push({c,o})));

odetail(){const c=list.find(x=>x.id==cur);const o=c&&(c.orders||[]).find(x=>x.id==mid);if(!o)return V.orders();
return `<div class="top"><button class="back" onclick="go('orders')">← Orders</button></div><div class="card" style="text-align:center"><h2>${esc(o.title)}</h2><div class="muted">for ${esc(c.name)}</div></div><div class="card"><h3>Progress</h3><div class="actions" style="margin-top:8px">${ST.map(s=>`<button class="btn ${o.status==s?'gold':'ghost'}" onclick="setSt(${c.id},${o.id},'${s}')">${s}</button>`).join('')}</div></div><div class="card"><dl class="dt"><dt>Due date</dt><dd>${o.due?fmtD(o.due):'—'}</dd><dt>Price</dt><dd>${o.price?naira(o.price):'—'}</dd>${o.cost?`<dt>Your cost</dt><dd>${naira(o.cost)}</dd><dt>Profit</dt><dd><b>${naira((Number(o.price)||0)-(Number(o.cost)||0))}</b></dd>`:''}</dl><h3 style="margin-top:14px">Notes</h3><p>${esc(o.note)||'—'}</p></div><div class="card"><h3>Payments</h3>${payBox(o)}${(o.payments||[]).map(p=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);cursor:default"><div><b>${naira(p.amount)}</b><br><small>${fmtD(p.date)} · ${esc(p.method)}${p.note?' · '+esc(p.note):''}</small></div><div style="display:flex;gap:8px"><button class="back" aria-label="Receipt" onclick="rpid=${p.id};go('receipt',${c.id},${o.id})">🧾 Receipt</button><button class="back" aria-label="Remove payment" onclick="delP(${c.id},${o.id},${p.id})">✕</button></div></div>`).join('')}<div class="actions"><button class="btn gold" onclick="go('pform',${c.id},${o.id})">+ Add payment</button></div></div><div class="card"><h3>Photos</h3>${phGrid(c,(c.photos||[]).filter(p=>p.oid==o.id))}<div class="actions"><button class="btn gold" onclick="pOid=${o.id};$('#pfile').click()">+ Add photo</button></div></div><div class="actions"><button class="btn" onclick="go('oform',${c.id},${o.id})">Edit</button><button class="btn gold" onclick="go('wa',${c.id},${o.id})">💬 Message</button><button class="btn gold" onclick="go('mlist',${c.id})">📏 Measurements</button><button class="btn del" onclick="delO(${c.id},${o.id})">Delete</button></div>`},
oform(){const c0=list.find(x=>x.id==cur);const o=(c0&&(c0.orders||[]).find(x=>x.id==mid))||{};const s=o.status||ST[0];
return `<div class="top"><button class="back" onclick="${o.id?`go('odetail',${c0.id},${o.id})`:`go('orders')`}">← Cancel</button><h2>${o.id?'Edit':'New'} order</h2></div><div class="card"><label>Customer *</label><select id="o_cust"${o.id?' disabled':''}>${c0?'':'<option value="">Choose a customer</option>'}${list.map(c=>`<option value="${c.id}"${c0&&c0.id==c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select><label>What is being made? *</label><input id="o_title" value="${esc(o.title)}" placeholder="e.g. Wedding gown"><div class="two"><div><label>Due date</label><input id="o_due" type="date" value="${esc(o.due)}"></div><div><label>Progress</label><select id="o_status">${ST.map(x=>`<option${x==s?' selected':''}>${x}</option>`).join('')}</select></div></div><label>Price (${SET.cur})</label><input id="o_price" type="number" min="0" inputmode="decimal" value="${esc(o.price)}"><label>Your cost, optional (${SET.cur})</label><input id="o_cost" type="number" min="0" inputmode="decimal" value="${esc(o.cost)}"><p class="muted" style="margin:4px 0 0;font-size:12px">Fabric, thread and helpers. Used for your profit report.</p><label>Notes</label><textarea id="o_note">${esc(o.note)}</textarea><div class="actions"><button class="btn gold" onclick="submitO(${o.id||0})">Save order</button></div></div>`},
payments(){const all=[];list.forEach(c=>(c.orders||[]).forEach(o=>all.push({c,o,pr:Number(o.price)||0,pd:paid(o)})));
const owe=all.reduce((n,x)=>n+Math.max(0,x.pr-x.pd),0),got=all.reduce((n,x)=>n+x.pd,0);
const f=all.filter(x=>pfl=='all'||(pfl=='owing'?x.pr>x.pd:x.pr>0&&x.pd>=x.pr)).sort((a,b)=>(b.pr-b.pd)-(a.pr-a.pd));
const tab=(k,t)=>`<button class="btn ${pfl==k?'':'ghost'}" onclick="pfl='${k}';render()">${t}</button>`;

pform(){const c=list.find(x=>x.id==cur),o=c&&(c.orders||[]).find(x=>x.id==mid);if(!o)return V.payments();const b=(Number(o.price)||0)-paid(o);
return `<div class="top"><button class="back" onclick="go('odetail',${c.id},${o.id})">← Cancel</button><h2>Add payment</h2></div><div class="card"><b>${esc(o.title)}</b><div class="muted">${esc(c.name)}</div>${payBox(o)}<label>Amount received (${SET.cur}) *</label><input id="p_amt" type="number" min="0" inputmode="decimal" value="${b>0?b:''}"><div class="two"><div><label>Date</label><input id="p_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Paid by</label><select id="p_method"><option>Cash</option><option>Bank transfer</option><option>Card / POS</option><option>Other</option></select></div></div><label>Note (optional)</label><input id="p_note" placeholder="e.g. 50% deposit"><div class="actions"><button class="btn gold" onclick="submitP(${c.id},${o.id})">Save payment</button></div></div>`},
wa(){const c=list.find(x=>x.id==cur);if(!c)return V.customers();const o=mid&&(c.orders||[]).find(x=>x.id==mid);

week(){const w=weekData();
const row=(c,o,pill,late)=>`<div class="card row" onclick="go('odetail',${c.id},${o.id})"><div class="av">🧵</div><div><b>${esc(o.title)}</b><br><small>${esc(c.name)}</small></div><span class="pill${late?' late':''}">${pill}</span></div>`;
const sec=(t,a)=>a.length?`<h3 style="margin:18px 4px 8px">${t}</h3>`+a.join(''):'';
const dueR=w.due.map(({c,o})=>{const d=dueTxt(o);return row(c,o,d[0]||'',d[1])});
const readyR=w.ready.map(({c,o})=>row(c,o,'Ready',0));

const bdR=w.bd.map(({c,d})=>`<div class="card row" onclick="go('detail',${c.id})"><div class="av">${esc(initials(c.name))}</div><div><b>${esc(c.name)}</b><br><small>${fmtB(c.birthday)}</small></div><span class="pill">${d===0?'Today 🎉':d===1?'Tomorrow':'in '+d+' days'}</span><button class="back" aria-label="Send a message" onclick="event.stopPropagation();wpre='bday';go('wa',${c.id},0)">💬</button></div>`);

receipt(){const c=list.find(x=>x.id==cur),o=c&&(c.orders||[]).find(x=>x.id==mid),p=o&&(o.payments||[]).find(x=>x.id==rpid);if(!p)return V.payments();

photo(){const c=list.find(x=>x.id==cur),p=c&&(c.photos||[]).find(x=>x.id==mid);if(!p)return V.customers();const o=p.oid&&(c.orders||[]).find(x=>x.id==p.oid);

setup(){return `<header class="hdr"><img class="lg" src="${LOGO}" alt=""><span class="sep"></span><h1>Welcome to<br><em>Digital Desk</em></h1><p>Set up in 20 seconds. You can change this later.</p></header>${installCard()}<div class="card">${setForm()}<div class="actions"><button class="btn gold" onclick="saveSetup(false)">Start using the app</button><button class="btn ghost" onclick="saveSetup(true)">Try it with sample customers</button></div><div class="actions" style="margin-top:6px"><button class="btn ghost" onclick="go('backup')">I already have a backup</button></div></div><div class="card"><h3>Good to know</h3><p class="muted" style="margin:6px 0">Your information stays on this phone and works without internet.</p><p class="muted" style="margin:6px 0">Download a backup now and then from Backup &amp; Restore.</p></div>`},

guide(){const t=[['Customers','Tap My Customers, then + to add someone. Search by name or phone number.'],['Measurements','Open a customer, tap Measurements, then + to save a new set. You can add your own measurements at the bottom.'],['Orders','Open a customer and tap New order. Update the progress as you sew.'],['Payments','Open an order and tap + Add payment. Tap Receipt to share a receipt.'],['Messages','Tap Message to open WhatsApp with a ready-made message.'],['Photos','Add photos to a customer or to an order.'],['Backup','Download a backup often and keep the file safe, for example in your email.']];

activate(){return `<header class="hdr"><img class="lg" src="${LOGO}" alt=""><span class="sep"></span><h1>Activate<br><em>Digital Desk</em></h1><p>Enter the details from your purchase email.</p></header><div class="card"><label>Email you used to buy</label><input id="a_em" type="email" autocomplete="email"><label>Order number</label><input id="a_od" placeholder="From your receipt email"><div class="actions"><button class="btn gold" onclick="doActivate()">Activate</button></div><p class="muted" id="a_msg" style="margin:12px 0 0"></p></div><div class="card"><p class="muted" style="margin:0">You only need to do this once, with internet. After that the app works offline. Your purchase works on up to 2 of your devices.</p></div>`},

history(){const c=list.find(x=>x.id==cur);if(!c)return V.customers();const os=(c.orders||[]).slice().sort((a,b)=>b.id-a.id);
const tot=os.reduce((n,o)=>n+(Number(o.price)||0),0),pd=os.reduce((n,o)=>n+paid(o),0),bal=Math.max(0,tot-pd);

return `<div class="top"><button class="back" onclick="go('detail',${c.id})">← ${esc(c.name)}</button></div><h2 style="margin:0 4px 10px">History</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">${stat('Total ordered',naira(tot))}${stat('Total paid',naira(pd))}${stat('Balance',naira(bal))}</div><p class="muted" style="margin:0 4px 6px">${os.length} orders · ${pays.length} payments · ${(c.measures||[]).length} measurement sets · ${(c.photos||[]).length} photos</p>`+(os.length?`<h3 style="margin:16px 4px 8px">Orders</h3>${oRows}`:'<div class="empty">No orders yet.</div>')+(pays.length?`<h3 style="margin:16px 4px 8px">Payments</h3>${pRows}`:'')+`<h3 style="margin:16px 4px 8px">Measurements and photos</h3><div class="card"><div class="actions" style="margin:0 0 10px"><button class="btn ghost" onclick="go('mlist',${c.id})">📏 ${(c.measures||[]).length} measurement sets</button></div>${phGrid(c,c.photos||[])}</div>`},
report(){const r=reportData();const tab=(k,t)=>`<button class="btn ${rpt==k?'':'ghost'}" onclick="rpt='${k}';render()">${t}</button>`;
const stat=(l,v,s)=>`<div class="card" style="margin:0"><div class="muted" style="font-size:12px">${l}</div><b style="font-size:20px">${v}</b>${s?`<div class="muted" style="font-size:12px">${s}</div>`:''}</div>`;
return topbar('Money Report')+`<div class="actions" style="margin:0 0 14px">${tab('month','This month')}${tab('last','Last month')}${tab('year','This year')}${tab('all','All time')}</div><p class="muted" style="margin:0 4px 10px">${r.label}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${stat('Money received',naira(r.got))}${stat('New orders',r.cnt,naira(r.ord)+' worth')}${stat('Profit',r.costed?naira(r.profit):'—',r.costed?'on '+r.costed+(r.costed==1?' order':' orders')+' with costs':'Add costs to your orders')}${stat('Still owed (all time)',naira(r.owed))}</div>`+
(r.top.length?`<h3 style="margin:18px 4px 8px">Top customers</h3>`+r.top.map(x=>`<div class="card row" onclick="go('history',${x.c.id})"><div class="av">${esc(initials(x.c.name))}</div><div><b>${esc(x.c.name)}</b></div><span class="pill">${naira(x.v)}</span></div>`).join(''):'')+
(r.prof.length?`<h3 style="margin:18px 4px 8px">Most profitable orders</h3>`+r.prof.map(x=>`<div class="card row" onclick="go('odetail',${x.c.id},${x.o.id})"><div class="av">🧵</div><div><b>${esc(x.o.title)}</b><br><small>${esc(x.c.name)}</small></div><span class="pill">${naira(x.p)}</span></div>`).join(''):'')+
`<p class="muted" style="margin:16px 4px 0;font-size:12px">Profit counts only orders where you entered a cost (fabric, thread, helpers). Money received is counted by the date of each payment.</p>`},
prefs(){return topbar('Customer Preferences')+(list.map(c=>`<div class="card" onclick="go('detail',${c.id})" style="cursor:pointer"><b>${esc(c.name)}</b><br>${chips(c.colours)}${chips(c.fabrics)}${chips(c.styles)}</div>`).join('')||'<div class="empty">No customers yet.</div>')},
birthdays(){const a=list.filter(c=>c.birthday).map(c=>({c,d:daysToBday(c.birthday)})).sort((x,y)=>x.d-y.d);
return topbar('Birthdays')+(a.map(({c,d})=>`<div class="card row" onclick="go('detail',${c.id})"><div class="av">${esc(initials(c.name))}</div><div><b>${esc(c.name)}</b><br><small>${fmtB(c.birthday)}</small></div><span class="pill">${d===0?'Today 🎉':d===1?'Tomorrow':'in '+d+' days'}</span><button class="back" aria-label="Send a message" onclick="event.stopPropagation();wpre='bday';go('wa',${c.id},0)">💬</button></div>`).join('')||'<div class="empty">Add birthdays to customer profiles to see them here.</div>')},

<div class="card"><h3>Restore from backup</h3><p class="muted">Choose a backup file. This replaces the customers currently on this device.</p><input type="file" id="rf" accept=".json,application/json" onchange="importData(this.files[0])"></div><p class="muted" id="bmsg"></p>`},
soon(){return topbar(cur)+`<div class="empty card"><div style="font-size:42px">✨</div><h3>${esc(cur)} are on the way</h3><p>This section arrives in the next version of your desk.</p></div>`}

/* ---------- actions ---------- */
async function submitForm(id){const g=k=>$('#f_'+k).value.trim();if(!g('name')){alert('Please enter the customer’s name.');return}
const old=list.find(x=>x.id==id)||{};
const c=Object.assign({},old,{name:g('name'),phone:g('phone'),email:g('email'),address:g('address'),birthday:g('birthday'),colours:split(g('colours')),fabrics:split(g('fabrics')),styles:split(g('styles')),instructions:g('instructions'),notes:g('notes')});
if(id)c.id=id;else delete c.id;
await save(c);await refresh();const n=list.find(x=>x.name===c.name&&x.phone===c.phone);go('detail',id||(n&&n.id))}
async function del(id){if(!confirm('Delete this customer? This cannot be undone.'))return;const c=list.find(x=>x.id==id);for(const p of (c&&c.photos)||[]){await delPh('ph:'+p.id);await delPh('th:'+p.id)}await remove(id);await refresh();go('customers')}
async function exportData(){try{const ph={};for(const c of list)for(const p of c.photos||[]){ph['ph:'+p.id]=await getPh('ph:'+p.id);ph['th:'+p.id]=await getPh('th:'+p.id)}const b=new Blob([JSON.stringify({photoData:ph,app:'tailors-digital-desk',date:new Date().toISOString(),customers:list,customFields:CF,bizName:BIZ,settings:SET},null,1)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tailors-desk-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();$('#bmsg').textContent='Backup created.'}catch(e){$('#bmsg').textContent='Could not create the backup here.'}}
async function importData(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.customers))throw 0;
if(!confirm('Replace current customers with '+d.customers.length+' from this backup?'))return;for(const c of list)for(const p of c.photos||[]){await delPh('ph:'+p.id);await delPh('th:'+p.id)}await clearAll();if(Array.isArray(d.customFields)){CF=d.customFields;await saveCF()}if(typeof d.bizName=='string'){BIZ=d.bizName;await saveBiz()}if(d.settings&&d.settings.cur){SET=Object.assign({},SET,d.settings,{done:true});await saveSet()}
for(const c of d.customers){delete c.id;await save(c)}if(d.photoData)for(const k in d.photoData)if(d.photoData[k])await putPh(k,d.photoData[k]);await refresh();$('#bmsg').textContent='Restored '+d.customers.length+' customers.'}catch(e){$('#bmsg').textContent='That file doesn’t look like a valid backup.'}}

const MF=[['Upper body',['Neck','Shoulder','Bust','Underbust','Waist','Hip','Armhole','Bicep','Sleeve length','Wrist','Back length','Front length','Dress length']],['Lower body',['Thigh','Knee','Ankle','Crotch depth','Inseam','Outseam','Skirt length']],['General',['Height']]];
async function submitM(cid,id){const c=list.find(x=>x.id==cid);const vals={};
groups().forEach((g,gi)=>g[1].forEach((n,i)=>{const v=$('#m_'+gi+'_'+i).value.trim();if(v)vals[n]=v}));
if(!Object.keys(vals).length){alert('Please enter at least one measurement.');return}
const r={id:id||Date.now(),label:$('#m_label').value.trim(),date:$('#m_date').value,unit:$('#m_unit').value,vals,note:$('#m_note').value.trim()};
c.measures=(c.measures||[]).filter(x=>x.id!=r.id).concat(r);
await save(c);await refresh();go('mdetail',cid,r.id)}
async function delM(cid,id){if(!confirm('Delete these measurements? This cannot be undone.'))return;const c=list.find(x=>x.id==cid);c.measures=(c.measures||[]).filter(x=>x.id!=id);await save(c);await refresh();go('mlist',cid)}
const ST=['Not started','In progress','Ready','Delivered'];
const fmtD=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
function dueTxt(o){if(o.status=='Delivered')return['Delivered',0];if(!o.due)return['',0];const p=o.due.split('-').map(Number),n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
const d=Math.round((new Date(p[0],p[1]-1,p[2])-t)/864e5);return d<0?['Overdue',1]:d==0?['Due today',0]:d==1?['Tomorrow',0]:['in '+d+' days',0]}
async function submitO(id){const cid=$('#o_cust').value,t=$('#o_title').value.trim();if(!cid){alert('Please choose a customer.');return}if(!t){alert('Please say what is being made.');return}
const c=list.find(x=>x.id==cid);const old=(c.orders||[]).find(x=>x.id==id)||{};const o=Object.assign({},old,{id:id||Date.now(),title:t,due:$('#o_due').value,status:$('#o_status').value,price:$('#o_price').value.trim(),cost:$('#o_cost').value.trim(),note:$('#o_note').value.trim()});
c.orders=(c.orders||[]).filter(x=>x.id!=o.id).concat(o);await save(c);await refresh();go('odetail',c.id,o.id)}
async function setSt(cid,id,s){const c=list.find(x=>x.id==cid);c.orders.find(x=>x.id==id).status=s;await save(c);await refresh();render()}
async function delO(cid,id){if(!confirm('Delete this order? This cannot be undone.'))return;const c=list.find(x=>x.id==cid);c.orders=(c.orders||[]).filter(x=>x.id!=id);await save(c);await refresh();go('orders')}
const naira=n=>SET.cur+Number(n).toLocaleString();
const paid=o=>(o.payments||[]).reduce((n,p)=>n+Number(p.amount),0);
const owedTotal=()=>naira(list.reduce((n,c)=>n+(c.orders||[]).reduce((s,o)=>s+Math.max(0,(Number(o.price)||0)-paid(o)),0),0));
function payBox(o){const pr=Number(o.price)||0,pd=paid(o),b=pr-pd;return `<dl class="dt"><dt>Price</dt><dd>${pr?naira(pr):'—'}</dd><dt>Paid</dt><dd>${naira(pd)}</dd><dt>Balance</dt><dd><b>${pr?(b<=0?'Fully paid ✓':naira(b)):'—'}</b></dd></dl>${pr?'':'<p class="muted">Add a price to the order to see the balance.</p>'}`}
async function submitP(cid,oid){const a=Number($('#p_amt').value);if(!(a>0)){alert('Please enter the amount paid.');return}
const c=list.find(x=>x.id==cid),o=c.orders.find(x=>x.id==oid);
o.payments=(o.payments||[]).concat({id:Date.now(),amount:a,date:$('#p_date').value||new Date().toISOString().slice(0,10),method:$('#p_method').value,note:$('#p_note').value.trim()});
await save(c);await refresh();go('odetail',cid,oid)}
async function delP(cid,oid,pid){if(!confirm('Remove this payment?'))return;const c=list.find(x=>x.id==cid),o=c.orders.find(x=>x.id==oid);o.payments=(o.payments||[]).filter(x=>x.id!=pid);await save(c);await refresh();render()}
let CF=[];
const groups=()=>CF.length?MF.concat([['My own measurements',CF]]):MF;
async function saveCF(){if(db)await new Promise(r=>{const t=db.transaction('meta','readwrite');t.objectStore('meta').put(CF,'customFields');t.oncomplete=()=>r();t.onerror=()=>r()})}
async function loadCF(){if(!db)return;const x=await getMeta('customFields');CF=Array.isArray(x)?x:[]}
function draft(){const d={};document.querySelectorAll('[id^="m_"]').forEach(e=>d[e.id]=e.value);return d}
function restore(d){for(const k in d){const e=document.getElementById(k);if(e)e.value=d[k]}}
async function addCF(){const n=$('#m_newf').value.trim();if(!n)return;
if(groups().flatMap(g=>g[1]).some(x=>x.toLowerCase()==n.toLowerCase())){alert('You already have a measurement with that name.');return}
const d=draft();CF.push(n);await saveCF();render();d.m_newf='';restore(d);const e=$('#m_'+MF.length+'_'+(CF.length-1));if(e)e.focus()}
async function rmCF(i){if(!confirm('Remove “'+CF[i]+'” from your list? Saved values for it will no longer be shown.'))return;const d=draft(),g='m_'+MF.length+'_';
for(let j=i;j<CF.length;j++){const nx=d[g+(j+1)];if(nx===undefined)delete d[g+j];else d[g+j]=nx}
CF.splice(i,1);await saveCF();render();restore(d)}

function waT(c,o){const f=c.name.trim().split(/\s+/)[0];let T=[];
if(o){const b=(Number(o.price)||0)-paid(o),bl=b>0?' The balance is '+naira(b)+'.':'';
T=[['ready','Ready for pickup','Hello '+f+', your '+o.title+' is ready for pickup.'+bl+' Thank you!'],['fit','Fitting reminder','Hello '+f+', please come in for a fitting of your '+o.title+'. When are you free?'],['due','Delivery date','Hello '+f+', your '+o.title+' will be ready by '+(o.due?fmtD(o.due):'the agreed date')+'.']];
if(b>0)T.push(['pay','Payment reminder','Hello '+f+', a gentle reminder about the balance of '+naira(b)+' for your '+o.title+'. Thank you!']);
T.push(['thanks','Thank you','Dear '+f+', thank you for choosing us for your '+o.title+'. We loved making it for you!'])}
T.push(['meas','Take measurements','Hello '+f+', when would you like to come in so we can take your measurements?'],['bday','Birthday','Happy birthday '+f+'! 🎉 Wishing you a beautiful day and a wonderful year ahead.'],['hi','Say hello','Hello '+f+', hope you are well! ']);return T}

function sendWA(){const c=list.find(x=>x.id==cur);let d=(c.phone||'').replace(/\D/g,'');
if(!d){alert('Please add a phone number to this customer first.');return}
if(d.startsWith('00'))d=d.slice(2);else if(d[0]=='0')d=SET.cc+d.slice(1);else if(d.length==10)d=SET.cc+d;
const u='https://wa.me/'+d+'?text='+encodeURIComponent($('#wa_txt').value);if(!window.open(u,'_blank'))location.href=u}
function daysTo(d){const p=d.split('-').map(Number),n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((new Date(p[0],p[1]-1,p[2])-t)/864e5)}
function weekData(){const all=[];list.forEach(c=>(c.orders||[]).forEach(o=>all.push({c,o})));
const act=all.filter(x=>x.o.status!='Delivered');
const due=act.filter(x=>x.o.due&&daysTo(x.o.due)<=7).sort((a,b)=>a.o.due.localeCompare(b.o.due));
const ready=act.filter(x=>x.o.status=='Ready');
const owing=all.map(x=>({c:x.c,o:x.o,b:(Number(x.o.price)||0)-paid(x.o)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b);
const bd=list.map(c=>({c,d:daysToBday(c.birthday)})).filter(x=>x.d!==null&&x.d<=7).sort((a,b)=>a.d-b.d);
return{due,ready,owing,bd}}
function weekSummary(){const w=weekData(),p=[];if(w.due.length)p.push(w.due.length+' due');if(w.owing.length)p.push(w.owing.length+' owing');if(w.bd.length)p.push(w.bd.length+(w.bd.length>1?' birthdays':' birthday'));return p.join(' · ')||'All clear'}

async function drawReceipt(c,o,p){const W=800,H=980,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d'),LS=('letterSpacing' in x);
x.fillStyle='#f7efe4';x.fillRect(0,0,W,H);
const g=x.createLinearGradient(0,0,W,200);g.addColorStop(0,'#3b2418');g.addColorStop(1,'#170b06');x.fillStyle=g;x.fillRect(0,0,W,190);x.fillStyle='#d8b46f';x.fillRect(0,190,W,5);
try{const im=new Image();await new Promise(r=>{im.onload=r;im.onerror=r;im.src=LOGO});x.drawImage(im,40,45,100,100)}catch(e){}
x.textAlign='left';x.fillStyle='#f6e9d4';x.font='600 44px "Cormorant Garamond",Georgia,serif';x.fillText(BIZ||'Receipt',165,100,590);
x.fillStyle='#e2c07a';x.font='500 20px Jost,Arial,sans-serif';if(LS)x.letterSpacing='4px';x.fillText('PAYMENT RECEIPT',167,142);if(LS)x.letterSpacing='0px';
const pr=Number(o.price)||0,pd=paid(o),b=pr-pd;let y=270;
const row=(l,v,bold)=>{x.textAlign='left';x.fillStyle='#7d6a5a';x.font='400 24px Jost,Arial,sans-serif';x.fillText(l,60,y);x.textAlign='right';x.fillStyle='#2b1a12';x.font=(bold?'600':'500')+' 26px Jost,Arial,sans-serif';x.fillText(v,W-60,y,420);y+=62};
row('Receipt no.','R-'+String(p.id).slice(-6));row('Date',fmtD(p.date));row('Received from',c.name);row('For',o.title);row('Paid by',p.method);
x.strokeStyle='#d8b46f';x.lineWidth=2;x.beginPath();x.moveTo(60,y-26);x.lineTo(W-60,y-26);x.stroke();
y+=34;x.textAlign='left';x.fillStyle='#7d6a5a';x.font='400 24px Jost,Arial,sans-serif';x.fillText('Amount paid',60,y);
x.textAlign='right';x.fillStyle='#2b1a12';x.font='600 60px "Cormorant Garamond",Georgia,serif';x.fillText(naira(p.amount),W-60,y+12);y+=90;
row('Total price',pr?naira(pr):'—');row('Paid so far',naira(pd));row('Balance',pr?(b<=0?'Fully paid':naira(b)):'—',true);
x.textAlign='center';x.fillStyle='#a97b3c';x.font='italic 500 32px "Cormorant Garamond",Georgia,serif';x.fillText('Thank you for choosing us.',W/2,H-60);
return cv}
async function showReceipt(){const c=list.find(x=>x.id==cur),o=c&&(c.orders||[]).find(x=>x.id==mid),p=o&&(o.payments||[]).find(x=>x.id==rpid);if(!p)return;try{await document.fonts.ready}catch(e){}rcCv=await drawReceipt(c,o,p);const i=$('#rcimg');if(i)i.src=rcCv.toDataURL('image/png')}
function shareReceipt(){if(!rcCv)return;rcCv.toBlob(async b=>{const f=new File([b],'receipt.png',{type:'image/png'});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Receipt'});return}}catch(e){if(e&&e.name=='AbortError')return}
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='receipt.png';a.click()},'image/png')}
let pOid=0;const PH={};
const getPh=k=>db?new Promise(r=>{const x=store('meta').get(k);x.onsuccess=()=>r(x.result);x.onerror=()=>r()}):Promise.resolve(PH[k]);
const putPh=(k,d)=>db?new Promise(r=>{const t=db.transaction('meta','readwrite');t.objectStore('meta').put(d,k);t.oncomplete=()=>r();t.onerror=()=>r()}):(PH[k]=d,Promise.resolve());
const delPh=k=>db?new Promise(r=>{const t=db.transaction('meta','readwrite');t.objectStore('meta').delete(k);t.oncomplete=()=>r();t.onerror=()=>r()}):(delete PH[k],Promise.resolve());
function phGrid(c,a){return a.length?`<div class="pgrid">${a.map(p=>`<img data-ph="th:${p.id}" alt="Photo" onclick="go('photo',${c.id},${p.id})">`).join('')}</div>`:'<p class="muted">No photos yet.</p>'}
async function loadThumbs(){for(const i of document.querySelectorAll('img[data-ph]')){const d=await getPh(i.dataset.ph);if(d&&i.isConnected)i.src=d}}
function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const mk=(m,q)=>{const k=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',q)};try{res([mk(1280,.82),mk(360,.7)])}catch(e){rej(e)}URL.revokeObjectURL(u)};im.onerror=()=>rej();im.src=u})}
async function addPhotos(inp){const fs=[...inp.files];inp.value='';const c=list.find(x=>x.id==cur);if(!c||!fs.length)return;
for(const f of fs){try{const [full,th]=await shrink(f),id=Date.now()+Math.floor(Math.random()*1000);await putPh('ph:'+id,full);await putPh('th:'+id,th);(c.photos=c.photos||[]).push({id,date:new Date().toISOString().slice(0,10),oid:pOid||0})}catch(e){alert('Sorry, one photo could not be added.')}}
await save(c);await refresh();render()}
function dataBlob(d){const a=d.split(','),bin=atob(a[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:'image/jpeg'})}
async function sharePh(id){const d=await getPh('ph:'+id);if(!d)return;const b=dataBlob(d),f=new File([b],'photo.jpg',{type:'image/jpeg'});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name=='AbortError')return}
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='photo.jpg';a.click()}
async function delPhoto(cid,id){if(!confirm('Delete this photo?'))return;const c=list.find(x=>x.id==cid),p=(c.photos||[]).find(x=>x.id==id);c.photos=(c.photos||[]).filter(x=>x.id!=id);await delPh('ph:'+id);await delPh('th:'+id);await save(c);await refresh();go(p&&p.oid?'odetail':'detail',cid,p&&p.oid||0)}
let SET={cur:'₦',cc:'234',done:false};
const CTRY=[['Nigeria','₦','234'],['Ghana','GH₵','233'],['Kenya','KSh','254'],['South Africa','R','27'],['Uganda','USh','256'],['Tanzania','TSh','255'],['Cameroon','CFA','237'],['Senegal','CFA','221'],['Côte d’Ivoire','CFA','225'],['Zambia','ZK','260'],['United Kingdom','£','44'],['United States','$','1'],['Canada','$','1'],['Ireland','€','353'],['Germany','€','49'],['France','€','33'],['UAE','AED','971'],['India','₹','91'],['Australia','$','61']];
async function saveSet(){if(db)await new Promise(r=>{const t=db.transaction('meta','readwrite');t.objectStore('meta').put(SET,'settings');t.oncomplete=()=>r();t.onerror=()=>r()})}
async function loadSet(){if(!db)return;const x=await getMeta('settings');if(x&&typeof x=='object')SET=Object.assign({},SET,x)}
async function initSet(){if(!SET.done&&list.length){SET.done=true;await saveSet()}}
async function addSamples(){for(const s of SAMPLE)await save({name:s[0],phone:s[1],email:s[2],address:s[3],birthday:s[4],colours:s[5],fabrics:s[6],styles:s[7],instructions:s[8],notes:s[9]})}
function fillCountry(i){const c=CTRY[i];if(!c)return;$('#s_cur').value=c[1];$('#s_cc').value=c[2]}
function setForm(){const i=CTRY.findIndex(c=>c[1]==SET.cur&&c[2]==SET.cc);
return `<label>Where are you based?</label><select onchange="fillCountry(this.value)"><option value="">Choose your country</option>${CTRY.map((c,k)=>`<option value="${k}"${k==i?' selected':''}>${c[0]}</option>`).join('')}</select><div class="two"><div><label>Currency symbol</label><input id="s_cur" value="${esc(SET.cur)}"></div><div><label>Phone country code</label><input id="s_cc" inputmode="numeric" value="${esc(SET.cc)}"></div></div><label>Your business name (shows on receipts)</label><input id="biz" value="${esc(BIZ)}" placeholder="e.g. Your brand name">`}
async function saveSetup(sample){const cc=$('#s_cc').value.replace(/\D/g,'')||'234';if(cc.length>4){alert('The phone country code is only the first digits of a number, for example 234 for Nigeria or 44 for the UK. Please check this box.');return}SET.cur=$('#s_cur').value.trim()||'₦';SET.cc=cc;SET.done=true;try{await saveSet();await saveBiz();if(sample)await addSamples();await refresh()}catch(e){}go('home')}
const LIC_URL='';
let LIC={ok:false,device:''};
async function saveLic(){try{localStorage.setItem('tdd_device',LIC.device)}catch(e){}if(db)await new Promise(r=>{const t=db.transaction('meta','readwrite');t.objectStore('meta').put(LIC,'licence');t.oncomplete=()=>r();t.onerror=()=>r()})}
async function loadLic(){if(db){const x=await getMeta('licence');if(x&&typeof x=='object')LIC=Object.assign({},LIC,x)}
if(!LIC.device){let d='';try{d=localStorage.getItem('tdd_device')||''}catch(e){}LIC.device=d||(window.crypto&&crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36));await saveLic()}}
async function doActivate(){const em=$('#a_em').value.trim(),od=$('#a_od').value.trim(),m=$('#a_msg');if(!em||!od){m.textContent='Please fill in both boxes.';return}
m.textContent='Checking…';
try{const r=await fetch(LIC_URL+'?email='+encodeURIComponent(em)+'&order='+encodeURIComponent(od)+'&device='+encodeURIComponent(LIC.device),{redirect:'follow'});const j=await r.json();
if(j.ok){LIC.ok=true;LIC.email=em;await saveLic();view=SET.done?'home':'setup';render()}
else m.textContent=j.reason=='limit'?'This purchase is already used on 2 devices. Please contact the seller.':j.reason=='notfound'?'We could not find this purchase. Please check your email and order number, or try again in a minute.':'Please check the details and try again.'}
catch(e){m.textContent='No internet connection. Please connect to the internet to activate.'}}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
window.addEventListener('appinstalled',()=>{deferredInstall=null;render()});
function isApp(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
function inAppBrowser(){return /FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|Snapchat|TikTok|musical_ly|Twitter/i.test(navigator.userAgent)}
function installCard(){if(inAppBrowser()||!db)return '<div class="card" style="border-color:#b5655a"><b>Please open this in your browser</b><p class="muted" style="margin:6px 0 0">This screen may not be able to save your information. Open the link in <b>Chrome</b> (Android) or <b>Safari</b> (iPhone). If you are inside another app, tap the three dots and choose <b>Open in browser</b>.</p></div>';let h='';try{h=localStorage.getItem('tdd_hide_install')||''}catch(e){}if(isApp()||h)return '';
return `<div class="card" style="margin:0 0 14px"><b>Install this app on your phone</b><p class="muted" style="margin:6px 0 0">Add it to your home screen so it opens like a normal app, even without data.</p><div class="actions"><button class="btn gold" onclick="installApp()">Install app</button><button class="btn ghost" onclick="hideInstall()">Not now</button></div></div>`}
function installApp(){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(()=>{deferredInstall=null;render()},()=>{})}else go('install')}
function hideInstall(){try{localStorage.setItem('tdd_hide_install','1')}catch(e){}render()}
async function pickContact(){try{const r=await navigator.contacts.select(['name','tel'],{multiple:false});if(r&&r[0]){const c=r[0];if(c.name&&c.name[0])$('#f_name').value=c.name[0];if(c.tel&&c.tel[0])$('#f_phone').value=c.tel[0]}}catch(e){}}
function histLine(c){const os=c.orders||[],pd=os.reduce((n,o)=>n+paid(o),0);return os.length+(os.length==1?' order':' orders')+' · '+naira(pd)+' paid'}
let rpt='month';
function rptRange(){const n=new Date(),y=n.getFullYear(),m=n.getMonth();const f=(yy,mm,dd)=>yy+'-'+String(mm+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
if(rpt=='month')return[f(y,m,1),f(y,m,31),n.toLocaleDateString(undefined,{month:'long',year:'numeric'})];
if(rpt=='last'){const d=new Date(y,m-1,1);return[f(d.getFullYear(),d.getMonth(),1),f(d.getFullYear(),d.getMonth(),31),d.toLocaleDateString(undefined,{month:'long',year:'numeric'})]}
if(rpt=='year')return[f(y,0,1),f(y,11,31),String(y)];
return['0000-01-01','9999-12-31','All time']}
function reportData(){const [a,b,label]=rptRange();const ok=d=>d&&d>=a&&d<=b;let got=0,ord=0,cnt=0,cost=0,profit=0,costed=0;const cust={},prof=[];
list.forEach(c=>(c.orders||[]).forEach(o=>{const pr=Number(o.price)||0;(o.payments||[]).forEach(p=>{if(ok(p.date)){const v=Number(p.amount)||0;got+=v;cust[c.id]=(cust[c.id]||0)+v}});
const cd=new Date(o.id).toISOString().slice(0,10);if(ok(cd)){cnt++;ord+=pr;if(o.cost!==undefined&&o.cost!==''){const k=Number(o.cost)||0;cost+=k;profit+=pr-k;costed++;prof.push({c,o,p:pr-k})}}}));
const owed=list.reduce((n,c)=>n+(c.orders||[]).reduce((s,o)=>s+Math.max(0,(Number(o.price)||0)-paid(o)),0),0);
const top=Object.keys(cust).map(id=>({c:list.find(x=>x.id==id),v:cust[id]})).filter(x=>x.c).sort((x,y)=>y.v-x.v).slice(0,5);
prof.sort((x,y)=>y.p-x.p);return{label,got,ord,cnt,cost,profit,costed,owed,top,prof:prof.slice(0,5)}}
function reportSummary(){const k=new Date().toISOString().slice(0,7);let g=0;list.forEach(c=>(c.orders||[]).forEach(o=>(o.payments||[]).forEach(p=>{if((p.date||'').startsWith(k))g+=Number(p.amount)||0})));return naira(g)+' received this month'}

(async()=>{await openDb();await loadCF();await loadBiz();await loadSet();await refresh();await initSet();await loadLic();if(LIC_URL&&!LIC.ok){if(list.length){LIC.ok=true;LIC.owner=true;await saveLic()}else view='activate'}if(view=='home'&&!SET.done)view='setup';render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
